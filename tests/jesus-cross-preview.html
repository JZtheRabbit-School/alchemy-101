<!doctype html><meta charset="utf-8"><base href="/"><title>Jesus + Cross recipe preview</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="illustrated.css"><style>
.demo-controls{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:110;background:#211f18ed;border:1px solid #bda476;padding:10px 16px;text-align:center;color:#eedbb5}.demo-controls p{margin:0 0 6px;font-size:15px}.demo-controls button{padding:6px 14px;background:#d4c29e;color:#493b28}.demo-fly{position:fixed;width:74px;height:74px;z-index:100;pointer-events:none;filter:drop-shadow(0 0 14px #f8dfa080)}.demo-fly svg{width:100%;height:100%}.base-return{animation:base-arrival .8s ease-out}@keyframes base-arrival{0%{filter:brightness(2.2) drop-shadow(0 0 18px #f4dfa1)}100%{filter:none}}.demo-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,#eddfb85c,transparent 65%);animation:fade-demo 1s both}@keyframes fade-demo{to{opacity:0}}.item{touch-action:none}#room .quiet,#book,#trash{pointer-events:none}
</style><div class="demo-controls"><p id="demo-caption">Preview only · Jesus + Cross → Fire, Water, Air & Earth</p><button id="combine-demo">Show combination</button> <button id="reset-demo">Reset demo</button></div><script type="module">
import{art,moon}from'/art.js';const bases=['Fire','Water','Air','Earth'];const html=await(await fetch('/index.html')).text();document.body.prepend(new DOMParser().parseFromString(html,'text/html').querySelector('#room'));const room=document.querySelector('#room'),shelf=document.querySelector('#shelf'),basics=document.querySelector('#basics'),contents=document.querySelector('#contents');let running=false,drag=null;function item(name){const n=document.createElement('div');n.className='item';n.dataset.demo=name;n.setAttribute('aria-label',name);n.innerHTML=art(name);return n;}
for(let i=0;i<28;i++){const n=document.createElement('div');n.className='slot';n.innerHTML=`<span class="moon">${moon(i)}</span>`;shelf.append(n)}for(const name of bases){const n=document.createElement('div');n.className='base-slot';n.dataset.element=name;n.append(item(name));basics.append(n)}
function reset(){if(running)return;clearDrag();contents.replaceChildren(item('Jesus'));shelf.children[0].replaceChildren();shelf.children[0].innerHTML=`<span class="moon">${moon(0)}</span>`;shelf.children[0].append(item('Cross'));document.querySelector('#instruction').textContent='Drag the Cross into the beaker, or press Show combination.';document.querySelector('#demo-caption').textContent='Preview only · Jesus + Cross → Fire, Water, Air & Earth';document.querySelector('#combine-demo').disabled=false;}
async function combine(){if(running||!contents.children.length)return;running=true;document.querySelector('#combine-demo').disabled=true;shelf.children[0].querySelector('.item')?.remove();contents.replaceChildren();const flash=document.createElement('div');flash.className='demo-flash';document.querySelector('#beaker').append(flash);setTimeout(()=>flash.remove(),1100);const box=contents.getBoundingClientRect();const flights=bases.map((name,i)=>{const n=document.createElement('div');n.className='demo-fly';n.innerHTML=art(name);const angle=i*Math.PI/2-Math.PI/2;const x=box.left+box.width/2-37+Math.cos(angle)*58,y=box.top+box.height*.65-37+Math.sin(angle)*58;n.style.left=x+'px';n.style.top=y+'px';document.body.append(n);return {name,n,x,y}});document.querySelector('#demo-caption').textContent='The four elements return to Shelf B.';await new Promise(r=>setTimeout(r,850));await Promise.all(flights.map(async({name,n,x,y},i)=>{const target=basics.querySelector(`[data-element="${name}"]`),b=target.getBoundingClientRect();await n.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${(b.left+b.width/2-37-x)*.35}px,${b.top-75-y}px) scale(.8)`,opacity:1,offset:.5},{transform:`translate(${b.left+b.width/2-37-x}px,${b.top+b.height/2-37-y}px) scale(.55)`,opacity:0}],{duration:1400,delay:i*150,easing:'ease-in-out',fill:'forwards'}).finished;n.remove();target.classList.add('base-return');setTimeout(()=>target.classList.remove('base-return'),850)}));document.querySelector('#instruction').textContent='The beaker is empty. The four basic elements remain available.';document.querySelector('#demo-caption').textContent='Returned to Shelf B · No duplicate base items added';running=false;}
document.querySelector('#combine-demo').onclick=combine;document.querySelector('#reset-demo').onclick=reset;function clearDrag(){if(!drag)return;drag.node.classList.remove('dragging');drag.ghost.remove();drag=null;document.querySelector('#beaker').classList.remove('drop-hover')}
document.addEventListener('pointerdown',e=>{const n=e.target.closest('[data-demo="Cross"]');if(!n||running||e.button!==0)return;e.preventDefault();const ghost=document.createElement('div');ghost.className='demo-fly';ghost.innerHTML=art('Cross');ghost.style.left=(e.clientX-37)+'px';ghost.style.top=(e.clientY-37)+'px';document.body.append(ghost);n.classList.add('dragging');drag={node:n,ghost};n.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.ghost.style.left=(e.clientX-37)+'px';drag.ghost.style.top=(e.clientY-37)+'px'});
document.addEventListener('pointerup',e=>{if(!drag)return;const b=document.querySelector('#beaker').getBoundingClientRect();const inside=e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom;clearDrag();if(inside)combine()});document.addEventListener('pointercancel',clearDrag);
reset();
</script>
